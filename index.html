<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Oceano Surfwear — WebChat de teste (Nalu e Loja online)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; height: 100%; background: #e8f1f5; overflow: hidden; }
  .header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #0b3c5d; color: #fff; display: flex; align-items: center; padding: 0 12px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; z-index: 10; gap: 10px; }
  .header .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #1ca3c4; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .header .info { flex: 1; min-width: 0; }
  .header .info b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header .info span { display: block; font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header button { flex: none; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55); border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .header button:hover { background: rgba(255,255,255,.12); }

  /* Forca o painel do widget a ocupar a tela inteira (estilo app), abaixo do header. */
  #omni-chat-body-div {
    position: fixed !important;
    top: 56px !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    height: calc(100% - 56px) !important;
    max-height: calc(100% - 56px) !important;
    visibility: visible !important;
  }
  #omni-chat-body-frame { width: 100% !important; height: 100% !important; }
  /* Botao flutuante nao e necessario: o chat ja abre em tela cheia. */
  #omni-chat-btn-div { display: none !important; }
</style>
</head>
<body>
  <div class="header">
    <div class="avatar">🌊</div>
    <div class="info">
      <b>Oceano Surfwear · homologação</b>
      <span>escolha no chat: Nalu (B2B) ou Loja online</span>
    </div>
    <button id="novo" title="Esquece este visitante e começa como um cliente novo (sem memória nem histórico)">Novo cliente</button>
  </div>
  <script type="module">
    // O visitante fica salvo neste navegador: recarregar a página volta como o MESMO cliente,
    // o que permite testar a memória e o histórico das assistentes.
    // "Novo cliente" apaga o visitante e recomeça do zero (o menu de escolha aparece de novo).
    var KEY = 'oceano_webchat_client';
    function lerCliente() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function gravarCliente(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function novoId() { return (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : 'v' + Date.now() + Math.random().toString(16).slice(2); }

    document.getElementById('novo').addEventListener('click', function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    });

    var clientId = lerCliente();
    if (!clientId) { clientId = novoId(); gravarCliente(clientId); }

    (function(d) {
      window.omniChatQueueId = 10;
      window.omniChatDomain = 'oceano.evotalks.com.br';
      var s = d.createElement('script');
      s.async = true;
      s.src = 'https://statics.atenderbem.com/js/wbchat.min.js';
      s.onload = function () {
        window.omniChat.on('configLoaded', function () {
          window.omniChat.clientId = clientId;
        });
        window.omniChat.on('initialized', function () {
          window.omniChat.show();
        });
      };
      (d.head || d.body).appendChild(s);
    })(document);
  </script>
</body>
</html>
